name: arun_gas_consumer_app
description: Arun Gas Consumer App - Ujjwala 3.0 Module for LPG connections
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # Networking
  dio: ^5.3.0
  connectivity_plus: ^5.0.0
  http: ^1.1.0

  # TUS Upload
  tus_client: ^0.1.6

  # Image/File Handling
  image_picker: ^1.0.4
  file_picker: ^6.0.0
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0
  image: ^4.1.3

  # Location
  geolocator: ^10.1.0
  permission_handler: ^11.0.0

  # UI Components
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.0
  equatable: ^2.0.5
  logger: ^2.0.2
  url_launcher: ^6.2.1

  # Firebase (for push notifications)
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.0

  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1
  open_file: ^3.3.2

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
