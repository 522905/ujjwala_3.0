name: arun_gas_consumer_app
description: Arun Gas Consumer App - Ujjwala 3.0 Module for LPG connections
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  http: ^1.2.2
  http_parser: ^4.0.2

  # TUS Upload
  tusc: ^2.1.0

  # Image/File Handling
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1
  image: ^4.2.0

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # UI Components
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  logger: ^2.4.0
  url_launcher: ^6.3.1

  # Firebase (for push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.3
  open_file: ^3.5.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
